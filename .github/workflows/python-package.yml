# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test-py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test
        run: |
          pip install --upgrade pip
          pip install wheel setuptools
          pip install -e .
          pip install -r requirements-dev.txt
          coverage run -m unittest discover
          coverage json
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage_artifact
          path: coverage.json

  code-coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage_artifact
      - name: Check coverage
        run: |
          pip install monty==4.0.2
          python scripts/coverage.py

  benchmark-submission:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Verify archived AlchemBERT source
      run: |
        python benchmarks/matbench_v0.1_AlchemBERT/verify_source.py
        python -m unittest discover -s benchmarks/matbench_v0.1_AlchemBERT -p 'test_verify_source.py'
    - name: Run submission check
      run: |
        pip install --upgrade pip
        pip install wheel setuptools
        pip install -e .
        pip install -r requirements-dev.txt
        python -m unittest scripts/test_submission.py
    - name: Test AlchemBERT submission tools
      run: |
        pip install -r benchmarks/matbench_v0.1_AlchemBERT/rescore_requirements.txt inflect==7.5.0
        python -m unittest discover -s benchmarks/matbench_v0.1_AlchemBERT -p 'test_*.py'
    - name: Check new or updated classification results
      env:
        SUBMISSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        # Initial pushes have no before commit; compare against an empty tree is
        # inappropriate because it would treat all archived results as new.
        if [ -n "$SUBMISSION_BASE" ] && [ "$SUBMISSION_BASE" != "0000000000000000000000000000000000000000" ]; then
          python -m scripts.test_submission --base-ref "$SUBMISSION_BASE"
        fi
